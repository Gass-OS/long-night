name: Build Long Night APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install Android SDK packages
        run: L=$ANDROID_HOME/cmdline-tools; [ -e $L/latest ] || sudo ln -s $(ls -d $L/*/ | head -1) $L/latest; $L/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q ${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q ${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p tpl ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > ~/.config/godot/$f << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export APK
        run: |
          mkdir -p build
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME $ANDROID_HOME/build-tools $ANDROID_HOME/platforms $ANDROID_HOME/cmdline-tools; cat ~/.config/godot/editor_settings-4.3.tres; godot --headless --verbose --path . --export-debug "Android" build/LongNight.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LongNight-apk
          path: build/LongNight.apk
